<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>양지센터 B2F 입고 앱 가이드</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap">
<style>
/* 레이아웃: 왼쪽 공정 메뉴(데스크톱) / 위쪽 메뉴 버튼 + 서랍(폰), 오른쪽 한 화면에 공정 하나 */
:root{
  --brand:#0040d1; --brand-strong:#0035ad; --brand-soft:#eef4ff; --brand-line:#d7e3fb;
  --bg:#f5f7fb; --surface:#ffffff; --surface-2:#f8fbff; --side:#fbfcff;
  --line:#e7edf7; --text:#111827; --sub:#5b6472; --sub-2:#374151;
  --danger:#d92d20; --danger-bg:#fff1f0; --danger-line:#f6d3cf;
  --ok:#167c4b; --ok-bg:#eefbf3; --ok-line:#c9ecd7;
  --warn:#9a4d00; --warn-bg:#fff8f1; --warn-line:#ffd8ae; --warn-item:#fff;
  --admin:#7a3cc4; --admin-bg:#f5effd;
  --shadow:0 10px 30px rgba(17,24,39,.08); --shadow-sm:0 4px 14px rgba(17,24,39,.04);
  --hero-a:#ffffff; --hero-b:#f6f9ff; --hero-line:#d9e5ff;
  --scrim:rgba(15,23,42,.5);
  --font:'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --sidebar-w:288px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --brand:#7ea2ff; --brand-strong:#9db8ff; --brand-soft:#1b2747; --brand-line:#2c3d66;
  --bg:#0e131d; --surface:#151b27; --surface-2:#1a2231; --side:#121824;
  --line:#253045; --text:#e8edf6; --sub:#9aa6b8; --sub-2:#c3ccd9;
  --danger:#ff8a80; --danger-bg:#2a1718; --danger-line:#4a2626;
  --ok:#6fd49e; --ok-bg:#132a20; --ok-line:#1f4632;
  --warn:#ffb86b; --warn-bg:#271d12; --warn-line:#4a3519; --warn-item:#1f1810;
  --admin:#c7a3ff; --admin-bg:#251c37;
  --shadow:0 10px 30px rgba(0,0,0,.35); --shadow-sm:0 4px 14px rgba(0,0,0,.25);
  --hero-a:#151b27; --hero-b:#16203a; --hero-line:#2c3d66; --scrim:rgba(0,0,0,.6);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --brand:#7ea2ff; --brand-strong:#9db8ff; --brand-soft:#1b2747; --brand-line:#2c3d66;
  --bg:#0e131d; --surface:#151b27; --surface-2:#1a2231; --side:#121824;
  --line:#253045; --text:#e8edf6; --sub:#9aa6b8; --sub-2:#c3ccd9;
  --danger:#ff8a80; --danger-bg:#2a1718; --danger-line:#4a2626;
  --ok:#6fd49e; --ok-bg:#132a20; --ok-line:#1f4632;
  --warn:#ffb86b; --warn-bg:#271d12; --warn-line:#4a3519; --warn-item:#1f1810;
  --admin:#c7a3ff; --admin-bg:#251c37;
  --shadow:0 10px 30px rgba(0,0,0,.35); --shadow-sm:0 4px 14px rgba(0,0,0,.25);
  --hero-a:#151b27; --hero-b:#16203a; --hero-line:#2c3d66; --scrim:rgba(0,0,0,.6);
  color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--text);word-break:keep-all;line-height:1.6;font-size:15px}
button{font:inherit;border:0;background:none;cursor:pointer;color:inherit}
button:focus-visible,a:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
a{color:var(--brand)}
h1,h2,h3{text-wrap:balance}

.layout{display:grid;grid-template-columns:var(--sidebar-w) minmax(0,1fr);min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;overflow-y:auto;border-right:1px solid var(--line);background:var(--side);padding:22px 16px}
.logo{display:flex;align-items:center;gap:12px;margin-bottom:20px;cursor:pointer}
.logo-mark{width:42px;height:42px;border-radius:12px;background:var(--brand);color:var(--bg);display:grid;place-items:center;font-weight:900;font-size:13px;letter-spacing:.02em;flex:0 0 auto}
.logo-text strong{display:block;font-size:16px;line-height:1.3}
.logo-text span{display:block;font-size:12px;color:var(--sub)}
.nav-group{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--sub);margin:14px 4px 8px}
.nav-list{display:flex;flex-direction:column;gap:6px}
.nav-btn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:11px 12px;border-radius:14px;border:1px solid var(--line);background:var(--surface);transition:.15s ease}
.nav-btn:hover{background:var(--surface-2);border-color:var(--brand-line)}
.nav-btn.active{background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:0 10px 24px rgba(0,64,209,.18)}
:root[data-theme="dark"] .nav-btn.active{color:#0b1220}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .nav-btn.active{color:#0b1220}}
.nav-num{width:28px;height:28px;border-radius:999px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand);font-size:12px;font-weight:900;flex:0 0 auto}
.nav-btn.active .nav-num{background:rgba(255,255,255,.2);color:inherit}
.nav-copy strong{display:block;font-size:14px;line-height:1.35}
.nav-copy span{display:block;font-size:11.5px;opacity:.75}

.main{padding:26px 28px 40px;min-width:0}
.main-inner{max-width:1180px;margin:0 auto}

.mobile-top{display:none;position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:var(--surface)}
.mobile-top-inner{display:flex;align-items:center;justify-content:space-between;gap:12px}
.mobile-menu{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--brand);font-size:18px;font-weight:900}
.drawer-wrap{position:fixed;inset:0;z-index:40}
.drawer-bg{position:absolute;inset:0;background:var(--scrim)}
.drawer{position:absolute;top:0;right:0;width:min(88vw,340px);height:100%;background:var(--surface);overflow:auto;box-shadow:-10px 0 28px rgba(17,24,39,.18);padding:calc(16px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) 16px}
.drawer-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:20px}

/* 첫 화면 */
.hero{background:linear-gradient(135deg,var(--hero-a) 0%,var(--hero-b) 100%);border:1px solid var(--hero-line);border-radius:28px;padding:28px;box-shadow:var(--shadow)}
.hero-eyebrow{display:inline-flex;gap:6px;align-items:center;padding:7px 12px;border-radius:999px;background:var(--brand-soft);color:var(--brand);font-size:12.5px;font-weight:900;margin-bottom:12px}
.hero h1{margin:0 0 10px;color:var(--danger);font-size:30px;font-weight:900;line-height:1.25;letter-spacing:-.03em}
.hero .lead{margin:0 0 18px;color:var(--sub);font-size:15.5px;line-height:1.8;max-width:820px}
.rule-list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.rule-list li{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.rule-dot{width:26px;height:26px;border-radius:999px;display:grid;place-items:center;background:var(--danger-bg);color:var(--danger);font-size:13px;font-weight:900;flex:0 0 auto;margin-top:1px}
.rule-copy strong{display:block;font-size:15px;margin-bottom:2px}
.rule-copy span{display:block;font-size:14px;color:var(--sub);line-height:1.65}
.quick{margin-top:22px}
.quick h3{margin:0 0 10px;font-size:16px}
.quick-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.quick-card{display:flex;flex-direction:column;gap:4px;text-align:left;padding:14px 16px;border-radius:16px;border:1px solid var(--line);background:var(--surface);transition:.15s}
.quick-card:hover{border-color:var(--brand-line);background:var(--surface-2)}
.quick-card b{font-size:15px}
.quick-card span{font-size:12.5px;color:var(--sub);line-height:1.5}

/* 공정 화면 */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:26px;box-shadow:var(--shadow)}
.panel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:20px}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.badge{display:inline-flex;align-items:center;gap:4px;padding:6px 11px;border-radius:999px;font-size:12.5px;font-weight:900}
.badge.field{background:var(--brand-soft);color:var(--brand)}
.badge.admin{background:var(--admin-bg);color:var(--admin)}
.badge.step{background:var(--surface-2);color:var(--sub);border:1px solid var(--line)}
.panel h2{margin:0 0 6px;font-size:28px;line-height:1.25;letter-spacing:-.03em}
.panel .desc{margin:0;color:var(--sub);font-size:15px;line-height:1.7;max-width:760px}
.chip{padding:9px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);color:var(--sub);font-size:12.5px;font-weight:800;white-space:nowrap}
.sec-title{display:flex;align-items:center;gap:8px;margin:26px 0 12px;font-size:18px;font-weight:900}
.sec-title small{font-size:13px;font-weight:600;color:var(--sub)}
.two{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:22px;align-items:start}
.two > *{min-width:0}

.steps{display:grid;gap:10px;counter-reset:s}
.step{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 18px;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-sm)}
.step-l{display:flex;align-items:flex-start;gap:14px;min-width:0}
.step-no{width:36px;height:36px;border-radius:12px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-size:13px;font-weight:900;flex:0 0 auto;font-variant-numeric:tabular-nums}
.step-copy{min-width:0}
.step-copy strong{display:block;font-size:15.5px;line-height:1.5}
.step-copy span{display:block;font-size:14px;color:var(--sub);line-height:1.65;margin-top:2px}
.detail-btn{flex:0 0 auto;min-height:38px;padding:0 14px;border-radius:12px;background:var(--surface);border:1px solid var(--brand-line);color:var(--brand);font-size:13.5px;font-weight:800}
.detail-btn:hover{background:var(--surface-2)}

.shot{border:1px solid var(--line);border-radius:22px;background:var(--surface-2);padding:10px;position:sticky;top:20px}
.shot img{display:block;width:100%;height:auto;border-radius:14px;border:1px solid var(--line)}
.shot figcaption{font-size:12.5px;color:var(--sub);margin:8px 4px 2px;line-height:1.6}

.note{border-radius:18px;padding:16px 18px;font-size:14px;line-height:1.75;margin-top:14px}
.note b.t{display:block;margin-bottom:6px;font-size:15px}
.note ul{margin:0;padding-left:18px}
.note li+li{margin-top:3px}
.note.info{background:var(--brand-soft);border:1px solid var(--brand-line);color:var(--sub-2)}
.note.info b.t{color:var(--brand)}
.note.warn{background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--sub-2)}
.note.warn b.t{color:var(--warn)}
.note.ok{background:var(--ok-bg);border:1px solid var(--ok-line);color:var(--sub-2)}
.note.ok b.t{color:var(--ok)}
.note.danger{background:var(--danger-bg);border:1px solid var(--danger-line);color:var(--sub-2)}
.note.danger b.t{color:var(--danger)}

.tbl-wrap{overflow-x:auto;border-radius:16px;border:1px solid var(--line);margin-top:4px}
table{width:100%;border-collapse:collapse;background:var(--surface);min-width:560px}
th,td{padding:12px 14px;border-bottom:1px solid var(--line);text-align:left;font-size:14px;line-height:1.65;vertical-align:top}
tr:last-child td{border-bottom:0}
th{background:var(--surface-2);font-weight:800;font-size:13px;color:var(--sub-2)}
td b{font-weight:800}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.k{display:inline-block;padding:1px 8px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line);font-weight:800;font-size:13px;white-space:nowrap}
.tag{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:800;white-space:nowrap}
.tag.b{background:var(--brand-soft);color:var(--brand)}
.tag.o{background:var(--warn-bg);color:var(--warn)}
.tag.r{background:var(--danger-bg);color:var(--danger)}
.tag.g{background:var(--ok-bg);color:var(--ok)}

/* 하루 흐름 */
.flow{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-top:6px}
.flow-step{position:relative;border:1px solid var(--line);border-radius:16px;padding:14px 12px;background:var(--surface);min-width:0}
.flow-step.admin{background:var(--admin-bg);border-color:transparent}
.flow-step.field{background:var(--brand-soft);border-color:transparent}
.flow-who{font-size:11px;font-weight:900;letter-spacing:.06em}
.flow-step.admin .flow-who{color:var(--admin)}
.flow-step.field .flow-who{color:var(--brand)}
.flow-step b{display:block;font-size:15px;margin:4px 0 4px;line-height:1.35}
.flow-step span{display:block;font-size:12.5px;color:var(--sub);line-height:1.55}
.flow-step:not(:last-child)::after{content:"›";position:absolute;right:-9px;top:50%;transform:translateY(-50%);font-weight:900;color:var(--sub);font-size:18px;z-index:1}

.faq{display:grid;gap:10px}
.faq-item{border:1px solid var(--line);border-radius:16px;background:var(--surface);overflow:hidden}
.faq-q{width:100%;display:flex;justify-content:space-between;gap:12px;padding:16px 18px;text-align:left;font-weight:800;font-size:15px}
.faq-q i{font-style:normal;color:var(--brand);font-weight:900;font-size:18px;flex:0 0 auto}
.faq-a{padding:0 18px 18px;color:var(--sub-2);font-size:14px;line-height:1.8}
.faq-item.open .faq-q{background:var(--surface-2)}

.pager{display:flex;justify-content:space-between;gap:10px;margin-top:26px;padding-top:18px;border-top:1px solid var(--line)}
.pager button{padding:12px 16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:800;font-size:14px;text-align:left;max-width:48%}
.pager button small{display:block;font-size:11.5px;color:var(--sub);font-weight:700}
.pager button.next{margin-left:auto;text-align:right}

/* 상세 팝업 */
.modal{position:fixed;inset:0;z-index:999}
.modal-bg{position:absolute;inset:0;background:var(--scrim)}
.modal-dialog{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:min(760px,calc(100vw - 24px));max-height:calc(100vh - 40px);overflow:hidden;background:var(--surface);border-radius:24px;box-shadow:0 24px 80px rgba(15,23,42,.22);display:flex;flex-direction:column}
.modal-close{position:absolute;top:14px;right:14px;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:22px;line-height:1;z-index:2}
.modal-scroll{overflow-y:auto;padding:26px}
.modal-scroll h3{margin:0 50px 6px 0;font-size:24px;letter-spacing:-.02em}
.modal-sub{color:var(--sub);font-size:14px;margin:0 0 6px}
.m-sec{border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin-top:14px}
.m-sec h4{margin:0 0 8px;font-size:15.5px}
.m-sec p{margin:0 0 8px;font-size:14.5px;line-height:1.8;color:var(--sub-2)}
.m-sec p:last-child{margin:0}
.m-sec ol,.m-sec ul{margin:0;padding-left:20px;font-size:14.5px;line-height:1.85;color:var(--sub-2)}

@media (max-width:1080px){.quick-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.flow{grid-template-columns:repeat(3,minmax(0,1fr))}.flow-step:nth-child(3)::after{display:none}}
@media (max-width:980px){.two{grid-template-columns:1fr}.shot{position:static;max-width:340px}}
@media (max-width:900px){
  .layout{grid-template-columns:1fr}
  .sidebar{display:none}
  .mobile-top{display:block}
  .main{padding-block:16px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .rule-list{grid-template-columns:1fr}
  .hero,.panel{padding:20px;border-radius:22px}
  .hero h1{font-size:24px}.panel h2{font-size:23px}
  .panel-head{flex-direction:column}
}
@media (max-width:640px){
  .quick-grid{grid-template-columns:1fr}
  .flow{grid-template-columns:1fr 1fr}.flow-step::after{display:none}
  .step{flex-direction:column;align-items:stretch}
  .detail-btn{width:100%}
  .modal-scroll{padding:20px}.modal-scroll h3{font-size:20px}
  .pager{flex-direction:column}.pager button{max-width:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>


<div class="mobile-top">
  <div class="mobile-top-inner">
    <div class="logo" data-go="home" style="margin:0"><div class="logo-mark">B2F</div><div class="logo-text"><strong>양지센터 B2F 입고 앱 가이드</strong></div></div>
    <button class="mobile-menu" id="menuOpen" aria-label="가이드 메뉴 열기">☰</button>
  </div>
</div>
<div class="drawer-wrap" id="drawer" hidden>
  <div class="drawer-bg" data-close-drawer></div>
  <div class="drawer" role="dialog" aria-label="가이드 메뉴">
    <div class="drawer-head"><strong>가이드 메뉴</strong><button class="icon-btn" data-close-drawer aria-label="닫기">×</button></div>
    <div id="navMobile"></div>
  </div>
</div>

<div class="layout">
  <aside class="sidebar">
    <div class="logo" data-go="home"><div class="logo-mark">B2F</div><div class="logo-text"><strong>양지센터 B2F<br>입고 앱 가이드</strong><span>poomgo · 입고 파트</span></div></div>
    <div id="navDesk"></div>
  </aside>
  <main class="main"><div class="main-inner" id="view"></div></main>
</div>

<div class="modal" id="modal" hidden>
  <div class="modal-bg" data-close-modal></div>
  <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <button class="modal-close" data-close-modal aria-label="닫기">×</button>
    <div class="modal-scroll" id="mBody"></div>
  </div>

  if (!s) view.innerHTML = HOME();
  else {
    const prev = SECTIONS[i - 1], next = SECTIONS[i + 1];
    view.innerHTML = `<section class="panel">${s.html()}<div class="pager">${prev ? `<button data-go="${prev.id}"><small>‹ 이전</small>${prev.title}</button>` : `<button data-go="home"><small>‹ 처음</small>작업 전 확인사항</button>`}${next ? `<button class="next" data-go="${next.id}"><small>다음 ›</small>${next.title}</button>` : ''}</div></section>`;
  }
  document.getElementById('navDesk').innerHTML = navHtml(s ? s.id : '');
  document.getElementById('navMobile').innerHTML = navHtml(s ? s.id : '');
  document.title = (s ? s.title + ' · ' : '') + '양지센터 B2F 입고 앱 가이드';
}
function go(id){
  closeDrawer();
  const h = '#' + id;
  if (location.hash !== h) location.hash = h; else render();
  window.scrollTo({ top: 0 });
}
function openDetail(k){
  const d = DETAIL[k]; if (!d) return;
  document.getElementById('mBody').innerHTML = `<h3 id="mTitle">${d.t}</h3><p class="modal-sub">${d.s}</p>${d.b.map((x) => `<div class="m-sec"><h4>${x[0]}</h4>${x[1].startsWith('<') ? x[1] : `<p>${x[1]}</p>`}</div>`).join('')}`;
  const m = document.getElementById('modal'); m.hidden = false; m.querySelector('.modal-close').focus();
}
function closeModal(){ document.getElementById('modal').hidden = true; }
function closeDrawer(){ document.getElementById('drawer').hidden = true; }

document.addEventListener('click', (e) => {
  const g = e.target.closest('[data-go]'); if (g) { go(g.dataset.go); return; }
  const d = e.target.closest('[data-detail]'); if (d) { openDetail(d.dataset.detail); return; }
  if (e.target.closest('[data-close-modal]')) { closeModal(); return; }
  if (e.target.closest('[data-close-drawer]')) { closeDrawer(); return; }
  if (e.target.closest('#menuOpen')) { document.getElementById('drawer').hidden = false; return; }
  const q = e.target.closest('.faq-q');
  if (q) { const it = q.parentElement, open = !it.classList.contains('open'); it.classList.toggle('open', open); it.querySelector('.faq-a').hidden = !open; q.querySelector('i').textContent = open ? '−' : '+'; q.setAttribute('aria-expanded', open); }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { closeModal(); closeDrawer(); } });
window.addEventListener('hashchange', () => { render(); window.scrollTo({ top: 0 }); });
render();
</script>

</body>
